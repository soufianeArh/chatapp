services:
  chatapp-rabbitmq:
    image: rabbitmq:3-management
    container_name: chatapp-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - chatapp_network

  chatapp-mysql:
    image: mysql:latest
    container_name: ${CONTAINER_NAME}
    restart: always
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - chatapp_auth_data:/var/lib/mysql
    # command: ["mysqld", "--default-authentication-plugin=mysql_native_password"]
    networks:
      - chatapp_network
  chatapp_pg:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - chatapp_pg_data_1:/var/lib/postgresql/data
    networks:
      - chatapp_network

volumes:
  chatapp_auth_data:
  chatapp_pg_data_1:

networks:
  chatapp_network:
    driver: bridge
